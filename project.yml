name: Magpie
options:
  bundleIdPrefix: com.limboy
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Magpie:
    type: application
    platform: macOS
    sources:
      - path: Magpie
      # An Icon Composer icon; actool compiles it into the app icon.
      - path: assets/app.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limboy.magpie
        PRODUCT_NAME: Magpie
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle's keys, merged into the generated Info.plist.
        INFOPLIST_FILE: Magpie/Info.plist
        # Each GitHub release carries its own appcast.xml (scripts/release.sh).
        SPARKLE_FEED_URL: https://github.com/limboy/magpie-native/releases/latest/download/appcast.xml
        INFOPLIST_KEY_CFBundleDisplayName: Magpie
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: app
      configs:
        # Builds run from Xcode never offer to replace themselves; the menu
        # item still checks.
        Debug:
          SPARKLE_AUTOMATIC_CHECKS: NO
        Release:
          SPARKLE_AUTOMATIC_CHECKS: YES
