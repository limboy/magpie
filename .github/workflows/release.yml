name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-flight Quality Checks
        run: |
          npm run typecheck
          npm run lint

      - name: Generate release notes for build
        run: |
          npm run changelog
          test -s RELEASENOTES.md || exit 1
          echo "Release notes generated successfully"

      - name: Build renderer
        run: npm run build:renderer

      - name: Build, sign, notarize, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::electron-builder attempt $attempt"
            if npx electron-builder --mac --publish always; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed (likely transient notarization timeout). Retrying in 30s..."
            sleep 30
          done
          echo "All attempts failed"
          exit 1

      - name: Update GitHub release notes
        run: |
          RELEASE_NOTES=$(cat RELEASENOTES.md)
          gh release edit ${GITHUB_REF_NAME} --notes "$RELEASE_NOTES" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
